name: Block tracked environment files

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-tracked-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject committed .env configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          allowed_examples = {".env.example", ".env.sample", ".env.template"}
          forbidden = []
          for entry in tracked:
              if not entry:
                  continue
              basename = PurePosixPath(entry.decode("utf-8", "surrogateescape")).name
              if (basename == ".env" or basename.startswith(".env.")) and basename not in allowed_examples:
                  forbidden.append(basename)

          if forbidden:
              print(f"FAIL: {len(forbidden)} committed environment file(s).")
              print("Untrack them, rotate exposed credentials, and commit sanitized examples only.")
              sys.exit(1)
          print("PASS: no committed .env configuration files")
          PY
